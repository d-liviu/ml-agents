      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 1000
    summary_freq: 30000
env_settings:
  seed: 0
engine_settings: {}
checkpoint_settings: {}
torch_settings: {}
