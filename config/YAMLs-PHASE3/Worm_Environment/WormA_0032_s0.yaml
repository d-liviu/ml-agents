behaviors:
  Worm:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 2.357588986583377e-05
      beta: 0.0008949952556088035
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
