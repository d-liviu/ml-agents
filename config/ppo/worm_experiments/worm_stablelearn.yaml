behaviors:
  Worm:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4048           # doubled batch size
      buffer_size: 40480         # doubled buffer size
      learning_rate: 0.0003      # same lr
      beta: 0.0025               # lowered beta
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 1000
    summary_freq: 30000
